name: Bug report
description: A solution, simulation or the visualizer does something wrong
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Problem, lesson or page (a link from the demo is perfect)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
