name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viz/package-lock.json
      - run: npm ci
      - name: Solutions and system design tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - run: npm ci
        working-directory: viz
      - name: Visualizer tests
        run: npm test
        working-directory: viz
      - name: Visualizer build
        run: npm run build
        working-directory: viz
