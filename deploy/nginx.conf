server {
    listen 8080;
    root /usr/share/nginx/html;

    # The app routes with #/..., so every real path is a file; index.html must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Vite fingerprints everything under /assets, so it can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
